name: Native builds

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  PYTHONUTF8: '1'

jobs:
  macos:
    name: macOS ARM64 · DMG
    runs-on: macos-15
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install 1.94.1 --profile minimal --component rustfmt,clippy
          rustup default 1.94.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-arm64
          cache-on-failure: true
      - name: Build and test input helper
        run: |
          sh native/hook-helper/build.sh
          native/hook-helper/build/helper_tests
      - run: cargo fmt --all --check
      - run: cargo test --locked -p lolping-native
      - run: cargo clippy --locked -p lolping-native --all-targets -- -D warnings
      - name: Build app and DMG
        run: sh native/gpui/dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: lolPing-native-macos-arm64
          path: |
            release/native/*.dmg
            release/native/*.zip
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows ${{ matrix.arch }} · EXE
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-2022
            msvc: x64
            python: x64
            target: x86_64-pc-windows-msvc
          - arch: aarch64
            runner: windows-11-arm
            msvc: arm64
            python: arm64
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python }}
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc }}
      - name: Prepare and probe desktop notification area
        run: ./native/gpui/verify_windows.ps1 -Architecture ${{ matrix.arch }} -DesktopOnly
      - name: Locate Windows shader compiler
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\fxc.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $fxc) { throw 'Windows SDK fxc.exe not found' }
          "GPUI_FXC_PATH=$($fxc.FullName)" >> $env:GITHUB_ENV
      - name: Install native Rust toolchain
        run: |
          rustup toolchain install 1.94.1-${{ matrix.target }} --profile minimal --component rustfmt,clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.94.1-${{ matrix.target }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc -vV
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-${{ matrix.arch }}
          cache-on-failure: true
      - name: Build and test native input helper
        run: |
          ./native/hook-helper/build.ps1 -Architecture ${{ matrix.msvc }}
          ./native/hook-helper/build/helper_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: cargo fmt --all --check
      - run: cargo test --locked -p lolping-native
      - run: cargo clippy --locked -p lolping-native --all-targets -- -D warnings
      - name: Build installer and portable ZIP
        run: python native/gpui/bundle_windows.py --arch ${{ matrix.arch }}
      - name: Install, launch, test and uninstall shipped application
        timeout-minutes: 5
        run: ./native/gpui/verify_windows.ps1 -Architecture ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostics-windows-${{ matrix.arch }}
          path: release/native/verification-logs/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: lolPing-native-windows-${{ matrix.arch }}
          path: |
            release/native/*-setup.exe
            release/native/*-windows-${{ matrix.arch }}.zip
            release/native/verification-windows-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [macos, windows]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: native-release-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v5
        with:
          pattern: lolPing-native-*
          path: release/downloads
          merge-multiple: true
      - name: Publish all verified architectures together
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 native/gpui/publish_release.py release/downloads
